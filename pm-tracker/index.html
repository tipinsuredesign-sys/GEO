<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TIPINSURE SEO — Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===== TIPINSURE Design System tokens ===== */
  :root{
    --primary:#1E22AA; --primary-50:#eef0ff; --primary-100:#dfe1ff;
    --primary-700:#1a1d8c; --primary-800:#14166b; --primary-900:#0a0c3a;
    --accent:#E1261B; --accent-600:#bd1d14; --accent-soft:#fde7e6;
    --ink:#0b1020; --ink-soft:#5b6275; --ink-faint:#858ca0;
    --muted:#f5f6fb; --line:#e9ebf2; --surface:#ffffff; --body-bg:#fbfbfd;
    --green:#1e9e6a; --green-soft:#e4f6ee;
    --amber:#b7791f; --amber-soft:#fdf2dc;
    --blue:#1E22AA; --blue-soft:#eef0ff;
    --shadow-sm:0 1px 2px rgba(16,24,64,.06), 0 2px 6px rgba(16,24,64,.04);
    --shadow-md:0 10px 30px rgba(16,24,64,.08), 0 2px 8px rgba(16,24,64,.04);
    --shadow-lg:0 30px 70px rgba(16,24,64,.14), 0 8px 20px rgba(16,24,64,.06);
    --r-sm:12px; --r-md:18px; --r-lg:26px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Noto Sans Thai',system-ui,-apple-system,sans-serif;
    background:var(--body-bg);color:var(--ink);line-height:1.6;
    padding-bottom:60px;font-feature-settings:"ss01";
  }
  a{color:var(--primary)}
  ::selection{background:var(--primary);color:#fff}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}

  /* Header */
  header{
    background:linear-gradient(135deg,var(--primary-900),var(--primary-700));
    padding:26px 0 24px;position:sticky;top:0;z-index:50;
    box-shadow:var(--shadow-md);
  }
  header .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand h1{font-size:20px;font-weight:800;letter-spacing:-.01em;color:#fff}
  .brand p{font-size:12.5px;color:rgba(255,255,255,.72);margin-top:2px}
  .brand .dot{color:#fff;opacity:.5}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap}
  .btn{
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:13px;cursor:pointer;font-weight:600;
    transition:all .3s;display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{background:rgba(255,255,255,.2);transform:translateY(-1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 8px 20px rgba(225,38,27,.28)}
  .btn.primary:hover{background:var(--accent-600);box-shadow:0 14px 30px rgba(225,38,27,.34)}
  .btn.danger:hover{background:var(--accent);border-color:var(--accent)}
  .menu-wrap{position:relative}
  .menu{position:absolute;top:calc(100% + 8px);left:0;background:var(--surface);border:1px solid var(--line);
    border-radius:var(--r-md);box-shadow:var(--shadow-lg);padding:6px;min-width:250px;z-index:60;display:none}
  .menu.open{display:block}
  .menu-item{display:block;width:100%;text-align:left;background:transparent;border:none;
    padding:11px 14px;border-radius:var(--r-sm);font-size:13px;color:var(--ink);cursor:pointer;
    font-family:inherit;font-weight:500}
  .menu-item:hover{background:var(--primary-50);color:var(--primary)}
  .menu-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:var(--ink-faint);padding:8px 14px 4px}
  .menu-sep{height:1px;background:var(--line);margin:6px 0}

  /* Dashboard */
  .dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin:28px 0}
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    padding:20px;box-shadow:var(--shadow-sm);
  }
  .stat .num{font-size:32px;font-weight:800;line-height:1;color:var(--primary)}
  .stat .lbl{font-size:12.5px;color:var(--ink-soft);margin-top:8px;font-weight:600}
  .stat .sub{font-size:11px;color:var(--ink-faint);margin-top:3px}
  .card.progress-card{grid-column:1/-1}
  .pbar{height:14px;border-radius:999px;background:var(--muted);overflow:hidden;display:flex;margin-top:12px}
  .pbar i{height:100%;display:block;transition:width .6s cubic-bezier(.16,1,.3,1)}
  .pbar .done{background:var(--green)}
  .pbar .prog{background:var(--primary)}
  .pbar .block{background:var(--amber)}
  .team-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:14px}
  .team-mini{background:var(--muted);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px}
  .team-mini .tm-top{display:flex;justify-content:space-between;font-size:13px}
  .legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;font-size:12px;color:var(--ink-soft)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .swatch{width:11px;height:11px;border-radius:3px;display:inline-block}

  /* Filters */
  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:8px 0 20px}
  .filters input,.filters select{
    background:var(--surface);border:1px solid var(--line);color:var(--ink);
    padding:10px 14px;border-radius:999px;font-size:13px;font-family:inherit;
  }
  .filters input:focus,.filters select:focus{outline:none;border-color:var(--primary);
    box-shadow:0 0 0 3px var(--primary-50)}
  .filters input[type=search]{min-width:230px;flex:1}

  /* Task list */
  .phase-group{margin-bottom:28px}
  .phase-head{display:flex;align-items:center;gap:10px;margin:16px 0 14px;font-size:15px;font-weight:700;color:var(--ink)}
  .phase-head .pnum{
    width:28px;height:28px;border-radius:var(--r-sm);background:var(--primary);color:#fff;
    display:grid;place-items:center;font-size:12px;font-weight:800;
  }
  .phase-head small{color:var(--ink-soft);font-weight:500;font-size:12px}

  .task{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);
    padding:16px 18px;margin-bottom:12px;transition:all .3s;border-left:4px solid var(--ink-faint);
    box-shadow:var(--shadow-sm);
  }
  .task:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
  .task[data-sev="HIGH"]{border-left-color:var(--accent)}
  .task[data-sev="MEDIUM"]{border-left-color:var(--amber)}
  .task[data-sev="LOW"]{border-left-color:var(--primary)}
  .task.done{opacity:.6}
  .task.done .t-title{text-decoration:line-through;text-decoration-color:var(--ink-faint)}

  .t-top{display:flex;align-items:flex-start;gap:12px}
  .t-id{
    font-weight:800;font-size:13px;color:var(--primary);
    min-width:32px;padding-top:2px;
  }
  .t-main{flex:1;min-width:0}
  .t-title{font-size:15px;font-weight:700;margin-bottom:6px;letter-spacing:-.01em;color:var(--ink)}
  .t-badges{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
  .badge{font-size:10.5px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.03em}
  .badge.sev-HIGH{background:var(--accent-soft);color:var(--accent-600)}
  .badge.sev-MEDIUM{background:var(--amber-soft);color:var(--amber)}
  .badge.sev-LOW{background:var(--primary-50);color:var(--primary)}
  .badge.cat{background:var(--muted);color:var(--ink-soft)}
  .badge.owner{background:var(--primary-50);color:var(--primary)}
  .badge.team-Dev{background:var(--primary-50);color:var(--primary)}
  .badge.team-Content{background:var(--green-soft);color:var(--green)}
  .badge.team-Marketing{background:var(--amber-soft);color:var(--amber)}
  .badge.support{background:var(--muted);color:var(--ink-faint)}
  .t-todo{font-size:13px;color:var(--ink-soft);margin-bottom:4px;line-height:1.55}
  .t-note{font-size:12.5px;color:var(--ink-soft);margin-top:6px;background:var(--muted);
    padding:8px 12px;border-radius:var(--r-sm)}
  .t-note b{color:var(--ink);font-style:normal}

  .t-controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .status-sel{
    padding:7px 12px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;
    border:1px solid var(--line);font-family:inherit;
  }
  .status-sel[data-st="todo"]{background:var(--muted);color:var(--ink-soft)}
  .status-sel[data-st="progress"]{background:var(--primary-50);color:var(--primary);border-color:var(--primary)}
  .status-sel[data-st="blocked"]{background:var(--amber-soft);color:var(--amber);border-color:var(--amber)}
  .status-sel[data-st="done"]{background:var(--green-soft);color:var(--green);border-color:var(--green)}
  .mini-btn{font-size:12px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
    background:transparent;color:var(--ink-soft);cursor:pointer;font-weight:600;transition:all .2s}
  .mini-btn:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-50)}
  .t-updated{font-size:11px;color:var(--ink-faint);margin-left:auto}

  .empty{text-align:center;padding:50px;color:var(--ink-soft)}

  /* Modal */
  .modal-bg{position:fixed;inset:0;background:rgba(10,12,58,.5);display:none;place-items:center;
    z-index:100;padding:20px;backdrop-filter:blur(3px)}
  .modal-bg.open{display:grid}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
    max-width:540px;width:100%;padding:28px;box-shadow:var(--shadow-lg);max-height:90vh;overflow:auto}
  .modal h3{font-size:17px;margin-bottom:4px;font-weight:700;letter-spacing:-.01em}
  .modal .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:18px}
  .field{margin-bottom:15px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:7px;color:var(--ink-soft)}
  .field input,.field select,.field textarea{
    width:100%;background:var(--surface);border:1px solid var(--line);color:var(--ink);
    padding:11px 14px;border-radius:var(--r-sm);font-size:13.5px;font-family:inherit;
  }
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;
    border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
  .field textarea{resize:vertical;min-height:80px}
  .modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:8px}
  .modal .btn{background:var(--muted);border-color:var(--line);color:var(--ink)}
  .modal .btn:hover{background:var(--line);transform:none}
  .modal .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .modal .btn.primary:hover{background:var(--accent-600)}

  /* Sheet viewer */
  .mini-btn.excel:hover{color:var(--green);border-color:var(--green);background:var(--green-soft)}
  .sheet-modal{max-width:1100px;width:100%;max-height:92vh;display:flex;flex-direction:column}
  .sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .sheet-head .btn{background:var(--muted);border-color:var(--line);color:var(--ink)}
  .sheet-head .btn:hover{background:var(--line);transform:none}
  .sheet-tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 4px}
  .sheet-tab{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--muted);
    font-size:12.5px;cursor:pointer;color:var(--ink-soft);font-weight:600}
  .sheet-tab.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .sheet-toolbar{display:flex;gap:12px;align-items:center;margin:12px 0}
  .sheet-toolbar input{flex:1;background:var(--surface);border:1px solid var(--line);color:var(--ink);
    padding:10px 14px;border-radius:999px;font-size:13px;font-family:inherit}
  .sheet-toolbar input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-50)}
  .sheet-count{font-size:12px;color:var(--ink-soft);white-space:nowrap}
  .sheet-body{overflow:auto;flex:1;border:1px solid var(--line);border-radius:var(--r-md);min-height:200px}
  table.sheet{border-collapse:collapse;width:100%;font-size:12.5px}
  table.sheet th{position:sticky;top:0;background:linear-gradient(to right,var(--primary-900),var(--primary-700));
    color:#fff;text-align:left;padding:11px 13px;white-space:nowrap;font-weight:700}
  table.sheet td{padding:9px 13px;border-bottom:1px solid var(--line);color:var(--ink-soft);vertical-align:top;
    max-width:420px;overflow-wrap:anywhere}
  table.sheet tbody tr:nth-child(even) td{background:var(--muted)}
  table.sheet tr:hover td{background:var(--primary-50)}
  table.sheet td a{color:var(--primary);word-break:break-all}
  .sheet-note{font-size:11.5px;color:var(--ink-faint);margin-top:10px}
  .sheet-loading{padding:40px;text-align:center;color:var(--ink-soft)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--primary);color:#fff;padding:13px 24px;border-radius:999px;font-weight:600;
    font-size:13.5px;box-shadow:var(--shadow-lg);transition:.3s;z-index:200;opacity:0}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  footer{text-align:center;color:var(--ink-faint);font-size:12px;margin-top:36px}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <h1>TIPINSURE SEO <span class="dot">·</span> Project Tracker</h1>
      <p>ติดตามงานแก้ Technical Onsite Audit — www.tipinsure.com</p>
    </div>
    <div class="toolbar">
      <div class="menu-wrap">
        <button class="btn primary" id="btnReportMenu">📄 Export รายงาน ▾</button>
        <div class="menu" id="reportMenu">
          <div class="menu-label">รายงานทั้งหมด (30 งาน)</div>
          <button class="menu-item" data-report="pdf" data-scope="all">🖨️ พิมพ์ / บันทึกเป็น PDF</button>
          <button class="menu-item" data-report="html" data-scope="all">🌐 ดาวน์โหลด HTML</button>
          <button class="menu-item" data-report="csv" data-scope="all">📊 ดาวน์โหลด CSV (Excel)</button>
          <div class="menu-sep"></div>
          <div class="menu-label" id="menuFilterLabel">เฉพาะที่กรองอยู่</div>
          <button class="menu-item" data-report="pdf" data-scope="filtered">🖨️ พิมพ์ / PDF (เฉพาะที่กรอง)</button>
          <button class="menu-item" data-report="html" data-scope="filtered">🌐 HTML (เฉพาะที่กรอง)</button>
          <button class="menu-item" data-report="csv" data-scope="filtered">📊 CSV (เฉพาะที่กรอง)</button>
        </div>
      </div>
      <button class="btn" id="btnExport">⬇ Export JSON</button>
      <button class="btn" id="btnImport">⬆ Import JSON</button>
      <button class="btn danger" id="btnReset">↺ Reset</button>
      <input type="file" id="fileImport" accept="application/json" hidden>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="dash" id="dash"></section>

  <div class="filters">
    <input type="search" id="search" placeholder="🔍 ค้นหางาน (ชื่อ / สิ่งที่ต้องทำ / โน้ต)...">
    <select id="fSeverity">
      <option value="">ทุกระดับ</option>
      <option value="HIGH">HIGH</option>
      <option value="MEDIUM">MEDIUM</option>
      <option value="LOW">LOW</option>
    </select>
    <select id="fStatus">
      <option value="">ทุกสถานะ</option>
      <option value="todo">ยังไม่เริ่ม</option>
      <option value="progress">กำลังทำ</option>
      <option value="blocked">ติดขัด</option>
      <option value="done">เสร็จ</option>
    </select>
    <select id="fTeam">
      <option value="">ทุกทีม</option>
      <option value="Dev">Dev</option>
      <option value="Content">Content</option>
      <option value="Marketing">Marketing</option>
    </select>
    <select id="fView">
      <option value="phase">จัดกลุ่มตาม Action Plan</option>
      <option value="team">จัดกลุ่มตามทีม</option>
      <option value="severity">จัดกลุ่มตามระดับ</option>
      <option value="flat">เรียงตามหมายเลข</option>
    </select>
  </div>

  <section id="taskList"></section>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="mTitle">อัปเดตงาน</h3>
    <div class="sub" id="mSub"></div>
    <div class="field">
      <label>สถานะ</label>
      <select id="mStatus">
        <option value="todo">ยังไม่เริ่ม</option>
        <option value="progress">กำลังทำ</option>
        <option value="blocked">ติดขัด</option>
        <option value="done">เสร็จ</option>
      </select>
    </div>
    <div class="field">
      <label>ทีมหลัก (เจ้าภาพ)</label>
      <select id="mTeam">
        <option value="Dev">Dev</option>
        <option value="Content">Content</option>
        <option value="Marketing">Marketing</option>
      </select>
    </div>
    <div class="field">
      <label>ผู้รับผิดชอบ (ระบุชื่อคน)</label>
      <input type="text" id="mOwner" placeholder="เช่น คุณเอ (Dev), ทีม Content">
    </div>
    <div class="field">
      <label>โน้ต / ความคืบหน้า</label>
      <textarea id="mNote" placeholder="บันทึกสิ่งที่ทำไปแล้ว / ปัญหาที่เจอ / ลิงก์อ้างอิง..."></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn" id="mCancel">ยกเลิก</button>
      <button class="btn primary" id="mSave">บันทึก</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="sheetBg">
  <div class="modal sheet-modal">
    <div class="sheet-head">
      <div>
        <h3 id="sTitle">ข้อมูลจาก Excel</h3>
        <div class="sub" id="sSub"></div>
      </div>
      <button class="btn" id="sClose">✕ ปิด</button>
    </div>
    <div id="sTabs" class="sheet-tabs"></div>
    <div class="sheet-toolbar">
      <input type="search" id="sSearch" placeholder="🔍 กรองแถวในตาราง...">
      <span id="sCount" class="sheet-count"></span>
    </div>
    <div class="sheet-body" id="sBody"></div>
    <div class="sheet-note" id="sNote"></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<footer>ข้อมูลบันทึกในเบราว์เซอร์นี้ (localStorage) · Export JSON เพื่อแบ็กอัป/แชร์ข้ามเครื่อง</footer>

<script src="app.js"></script>
</body>
</html>
